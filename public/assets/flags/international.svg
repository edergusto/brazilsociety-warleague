<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bandeira Internacional</title>
  <defs>
    <pattern id="stars" width="32" height="26" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="7" r="3.2" fill="#fff"/><circle cx="24" cy="20" r="3.2" fill="#fff"/>
    </pattern>
  </defs>

  <!-- 1. Reino Unido -->
  <svg x="0" y="0" width="267" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="#012169"/>
    <path d="M0,0L400,300M400,0L0,300" stroke="#fff" stroke-width="50"/>
    <path d="M0,0L400,300M400,0L0,300" stroke="#C8102E" stroke-width="18"/>
    <path d="M200,0V300M0,150H400" stroke="#fff" stroke-width="90"/>
    <path d="M200,0V300M0,150H400" stroke="#C8102E" stroke-width="54"/>
  </svg>

  <!-- 2. França -->
  <svg x="267" y="0" width="266" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <rect width="134" height="300" fill="#0055A4"/>
    <rect x="133" width="134" height="300" fill="#fff"/>
    <rect x="266" width="134" height="300" fill="#EF4135"/>
  </svg>

  <!-- 3. Japão -->
  <svg x="533" y="0" width="267" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="#fff"/>
    <circle cx="200" cy="150" r="80" fill="#BC002D"/>
  </svg>

  <!-- 4. Estados Unidos -->
  <svg x="0" y="300" width="267" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="#fff"/>
    <g fill="#B22234">
      <rect y="0" width="400" height="23.1"/><rect y="46.2" width="400" height="23.1"/>
      <rect y="92.4" width="400" height="23.1"/><rect y="138.5" width="400" height="23.1"/>
      <rect y="184.6" width="400" height="23.1"/><rect y="230.8" width="400" height="23.1"/>
      <rect y="276.9" width="400" height="23.1"/>
    </g>
    <rect width="160" height="161.5" fill="#3C3B6E"/>
    <rect width="160" height="161.5" fill="url(#stars)"/>
  </svg>

  <!-- 5. Brasil -->
  <svg x="267" y="300" width="266" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="#009C3B"/>
    <polygon points="200,25 375,150 200,275 25,150" fill="#FFDF00"/>
    <circle cx="200" cy="150" r="70" fill="#002776"/>
    <path d="M132,142 Q205,120 268,162" fill="none" stroke="#fff" stroke-width="12"/>
  </svg>

  <!-- 6. China -->
  <svg x="533" y="300" width="267" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="300" fill="#DE2910"/>
    <polygon fill="#FFDE00" points="80,40 90.1,71.1 122.8,71.1 96.4,90.3 106.5,121.4 80,102.2 53.5,121.4 63.6,90.3 37.2,71.1 69.9,71.1"/>
    <g fill="#FFDE00"><circle cx="150" cy="30" r="9"/><circle cx="178" cy="62" r="9"/><circle cx="178" cy="102" r="9"/><circle cx="150" cy="132" r="9"/></g>
  </svg>

  <!-- Divisórias -->
  <g stroke="#fff" stroke-width="6">
    <line x1="267" y1="0" x2="267" y2="600"/><line x1="533" y1="0" x2="533" y2="600"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Emblema central: globo -->
  <g>
    <circle cx="400" cy="300" r="95" fill="#0B3D91" stroke="#fff" stroke-width="10"/>
    <g fill="none" stroke="#fff" stroke-width="5">
      <ellipse cx="400" cy="300" rx="45" ry="95"/>
      <line x1="400" y1="205" x2="400" y2="395"/>
      <line x1="305" y1="300" x2="495" y2="300"/>
      <path d="M317,240 Q400,265 483,240"/>
      <path d="M317,360 Q400,335 483,360"/>
    </g>
  </g>
  <rect x="3" y="3" width="794" height="594" fill="none" stroke="#fff" stroke-width="6" opacity="0"/>
</svg>
